<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coin Exchange</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial,sans-serif;color:#222}
.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f7f8}
header{background:#fff;padding:18px;border-bottom:1px solid #eee;font-weight:800;font-size:20px}
main{padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #0000000c}
h1{font-size:24px;margin:0 0 5px}.muted{font-size:12px;color:#888}
input{width:100%;height:48px;border:1px solid #ddd;border-radius:11px;padding:0 14px;font-size:16px;margin-top:12px}
button{cursor:pointer}.find{width:100%;height:48px;margin-top:10px;border:0;border-radius:11px;background:#111;color:#fff;font-weight:700}
.account{display:none;margin-top:14px;border:1px solid #eee;border-radius:12px;padding:13px}
.balance{font-size:30px;font-weight:800;margin:8px 0}.amount{width:100%;height:48px;border:1px solid #ddd;border-radius:11px;padding:0 12px;font-size:16px}
.exchange{width:100%;height:48px;border:0;border-radius:24px;background:#20d52a;color:#fff;font-weight:800;margin-top:12px}
#error{display:none;color:#c22;font-size:12px;margin-top:8px}
#history{margin-top:15px}.tx{padding:10px 0;border-bottom:1px solid #eee;font-size:12px}.tx:last-child{border:0}
.success{display:none;background:#fff;border-radius:18px;padding:22px;text-align:center}.check{margin:auto;width:65px;height:65px;border-radius:50%;background:#20d52a;color:#fff;font-size:40px;line-height:65px}
</style>
</head>
<body>
<div class="app">
<header>Coin Exchange</header>
<main>
<section class="card">
<h1>Exchange</h1><div class="muted">Внутренний баланс сервиса</div>
<input id="username" placeholder="@username">
<button class="find" onclick="loadAccount()">Найти аккаунт</button>
<div id="error"></div>
<div id="account" class="account">
<div class="muted">Баланс</div>
<div id="balance" class="balance">$0.00</div>
<div class="muted">Количество для списания</div>
<input id="amount" class="amount" type="number" min="0.01" step="0.01" value="100">
<button class="exchange" onclick="doExchange()">Exchange</button>
<div id="history"></div>
</div>
</section>
<section id="success" class="success">
<div class="check">✓</div>
<h2>Transaction completed</h2>
<div class="muted" id="txInfo"></div>
</section>
</main>
</div>
<script>
let current="";
const $=id=>document.getElementById(id);
function money(v){return "$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
async function loadAccount(){
  const u=$("username").value.trim();
  $("error").style.display="none";
  $("account").style.display="none";
  if(!u)return;
  const r=await fetch("/api/account?username="+encodeURIComponent(u));
  const d=await r.json();
  if(!r.ok){$("error").textContent=d.error;$("error").style.display="block";return;}
  current=d.username;
  $("account").style.display="block";
  render(d);
  loadHistory();
}
function render(d){$("balance").textContent=money(d.balance);}
async function loadHistory(){
  const r=await fetch("/api/transactions?username="+encodeURIComponent(current));
  const rows=await r.json();
  $("history").innerHTML="<div class='muted' style='margin-top:16px'>История</div>"+
    rows.map(x=>`<div class="tx">#${x.id} — списано ${money(x.amount)} — остаток ${money(x.balance_after)}<br>${new Date(x.created_at).toLocaleString()}</div>`).join("");
}
async function doExchange(){
  const amount=Number($("amount").value);
  const r=await fetch("/api/exchange",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:current,amount})});
  const d=await r.json();
  if(!r.ok){alert(d.error);return;}
  $("balance").textContent=money(d.balance);
  $("txInfo").textContent=`ID #${d.transactionId} • ${current} • списано ${money(d.amount)} • остаток ${money(d.balance)}`;
  $("success").style.display="block";
  loadHistory();
}
</script>
</body>
</html>
